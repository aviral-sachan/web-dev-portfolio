<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Leaf To-Do Web</title>
    <link rel="stylesheet" href="TODO.css">
</head>
<body class="light-theme">

    <div id="app-preloader">
        <div class="spinner"></div>
        <p style="font-family: inherit; font-weight: 600; letter-spacing: 0.5px;">Loading TaskLeaf Workspace...</p>
    </div>

    <div class="video-bg-container">
        <video id="video-a" class="bg-video buffer-active" autoplay muted playsinline></video>
        <video id="video-b" class="bg-video" autoplay muted playsinline></video>
    </div>

    <div class="forest-bg-layer"></div>
    <div id="cinematic-blur-overlay" class="initial-blur"></div>

    <div id="app-viewport-wrapper"></div>

    <script src="TODO.js"></script>
</body>
</html>
